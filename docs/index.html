<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17251d">
  <meta name="description" content="GroundStory reveals the stories beneath every place.">
  <title>GroundStory — What happened here?</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">GET IN ON THE</p>
      <h1>GroundStory</h1>
      <p class="tagline">Every place has a story.</p>
    </div>
    <button id="favoritesButton" class="icon-button" aria-label="Show favorites">★ <span id="favoriteCount">0</span></button>
  </header>

  <main>
    <section class="hero panel">
      <h2>What happened here?</h2>
      <p>Use your location or search for a place. GroundStory will find the most interesting documented stories nearby.</p>
      <div class="actions">
        <button id="locateButton" class="primary">Use my location</button>
        <form id="searchForm" class="search-form">
          <label class="sr-only" for="placeSearch">Search a place</label>
          <input id="placeSearch" placeholder="Booneville, Arkansas" autocomplete="off">
          <button type="submit">Search</button>
        </form>
      </div>
      <div class="controls">
        <label>Radius
          <select id="radiusSelect">
            <option value="5">5 miles</option>
            <option value="10" selected>10 miles</option>
            <option value="25">25 miles</option>
            <option value="50">50 miles</option>
          </select>
        </label>
        <label>Results
          <select id="limitSelect">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
          </select>
        </label>
      </div>
      <p id="status" class="status">Choose a location to begin.</p>
    </section>

    <section class="map-wrap panel">
      <div id="map" aria-label="Map of nearby stories"></div>
    </section>

    <section class="results-head">
      <div>
        <p class="eyebrow">NEARBY</p>
        <h2 id="resultsTitle">Stories</h2>
      </div>
      <span id="sourceBadge" class="badge" hidden></span>
    </section>
    <section id="storyList" class="story-list" aria-live="polite"></section>
  </main>

  <template id="storyTemplate">
    <article class="story-card">
      <img class="story-image" alt="" hidden>
      <div class="story-body">
        <div class="story-meta"><span class="category"></span><span class="distance"></span></div>
        <h3></h3>
        <p class="summary"></p>
        <div class="card-actions">
          <a class="source-link" target="_blank" rel="noopener">Read source</a>
          <a class="directions-link" target="_blank" rel="noopener">Directions</a>
          <button class="favorite" aria-label="Save favorite">☆</button>
        </div>
      </div>
    </article>
  </template>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
